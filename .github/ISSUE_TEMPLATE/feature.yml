name: Feature request
description: Suggest an improvement to Ward
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Describe what would help. Use synthetic examples and omit credentials and private inventories.
