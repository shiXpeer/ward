name: Bug report
description: Report a reproducible problem without sharing private inventories.
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and version
      description: Include OS and command; remove tokens, inventories, private URLs and keys.
    validations:
      required: true
