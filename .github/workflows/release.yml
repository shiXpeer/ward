name: Release binaries
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - run: make check
      - name: Build portable archives
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            target_os="${platform%/*}"
            target_arch="${platform#*/}"
            folder="shixpeer-ward_${version}_${target_os}_${target_arch}"
            mkdir -p "dist/$folder"
            for app in agent beacon relay; do
              CGO_ENABLED=0 GOOS="$target_os" GOARCH="$target_arch" go build -trimpath -buildvcs=false \
                -ldflags "-s -w -X shixpeer.com/ward/internal/buildinfo.Version=$version" \
                -o "dist/$folder/shixpeer-ward-$app" "./cmd/shixpeer-ward-$app"
            done
            cp LICENSE NOTICE THIRD_PARTY_NOTICES.md PRIVACY.md README.md README.uk.md CHANGELOG.md "dist/$folder/"
            cp -R configs docs api testdata "dist/$folder/"
            tar -C dist -czf "dist/$folder.tar.gz" "$folder"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS "${args[@]}"
