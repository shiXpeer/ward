worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    access_log off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $binary_remote_addr zone=metadata:1m rate=20r/s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        server_name ward.shixpeer.com;
        client_max_body_size 12k;
        set $ward_api ward-api:8443;
        location = / { root /site; try_files /index.html =404; }
        location /releases/ { root /site; try_files $uri =404; add_header Cache-Control "no-cache"; }
        location = /healthz { default_type application/json; return 200 '{"service":"ward-edge"}\n'; }
        location ~ ^/v1/(update-metadata|app-version|update-failures)$ {
            limit_req zone=metadata burst=64 nodelay;
            proxy_pass https://$ward_api;
            proxy_ssl_server_name on;
            proxy_ssl_name ward-api;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /trust/ca.crt;
            proxy_read_timeout 45s;
            proxy_set_header Host ward-api;
        }
        location / {
            limit_except GET HEAD { deny all; }
            proxy_pass https://$ward_api;
            proxy_ssl_server_name on;
            proxy_ssl_name ward-api;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /trust/ca.crt;
            proxy_read_timeout 120s;
            proxy_set_header Host ward-api;
        }
    }
}
